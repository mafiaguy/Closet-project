<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devika's Closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>

:root {
  --paper: #F1ECDF;
  --card: #FAF7EE;
  --ink: #26301F;
  --gold: #9C7E3A;
  --gold-soft: #E7DAB6;
  --line: #D8CFB9;
  --muted: #877E63;
}
* { box-sizing: border-box; margin: 0; }
body {
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Jost', sans-serif;
  -webkit-font-smoothing: antialiased;
}
.page { max-width: 1180px; margin: 0 auto; padding: 40px clamp(18px, 4vw, 56px) 56px; }

/* ---------------- masthead ---------------- */
.mast { text-align: center; padding-bottom: 8px; }
.crest { width: 44px; height: 44px; margin: 0 auto 10px; display: block; color: var(--gold); }
.eyebrow {
  font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase;
  color: var(--muted); font-weight: 500; display: block;
}
.name {
  font-family: 'Cormorant Garamond', serif; font-weight: 600;
  font-size: clamp(34px, 6vw, 58px); line-height: 1.08; cursor: pointer;
  display: inline-flex; align-items: baseline; gap: 12px; margin-top: 8px;
}
.pencil { width: 15px; height: 15px; color: var(--line); flex: none; transition: color .2s; }
.name:hover .pencil { color: var(--gold); }
.name-input {
  font-family: 'Cormorant Garamond', serif; font-weight: 600; text-align: center;
  font-size: clamp(34px, 6vw, 58px);
  border: none; border-bottom: 1px solid var(--gold);
  background: transparent; color: var(--ink); outline: none; width: 100%; max-width: 620px; margin-top: 8px;
}
.count-line { display: flex; align-items: center; gap: 16px; justify-content: center; margin-top: 14px; }
.count-line .rule { width: 72px; height: 1px; background: var(--line); }
.count-text {
  font-size: 11px; letter-spacing: .26em; text-transform: uppercase;
  color: var(--gold); font-weight: 500; white-space: nowrap;
}
.rule-double { max-width: 520px; margin: 22px auto 0; border-top: 1px solid var(--line); position: relative; }
.rule-double::after { content: ""; position: absolute; left: 0; right: 0; top: 3px; border-top: 1px solid var(--line); }

/* ---------------- note ---------------- */
.note {
  font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500;
  text-align: center; color: var(--muted); font-size: 17.5px; line-height: 1.55;
  max-width: 58ch; margin: 26px auto 34px;
}
.note em { color: var(--gold); font-style: italic; }

/* ---------------- paste / add ---------------- */
.paste-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.paste-input {
  flex: 1; min-width: 240px; max-width: 560px; padding: 13px 16px;
  border: 1px solid var(--line); border-radius: 2px;
  font: 400 14.5px 'Jost', sans-serif; background: var(--card); color: var(--ink);
}
.paste-input::placeholder { color: var(--muted); }
.paste-input:focus { outline: none; border-color: var(--gold); }

.btn {
  font: 500 11px 'Jost', sans-serif; letter-spacing: .16em; text-transform: uppercase;
  padding: 13px 22px; border-radius: 2px; border: 1px solid var(--ink);
  background: transparent; color: var(--ink); cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
  transition: background .18s ease, color .18s ease, border-color .18s ease;
}
.btn:hover { background: var(--ink); color: var(--card); }
.btn:focus-visible, .chip.clickable:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn.primary { background: var(--ink); color: var(--card); }
.btn.primary:hover { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.btn.ghost { border-color: var(--line); color: var(--muted); }
.btn.ghost:hover { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.small { padding: 8px 14px; font-size: 10px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; cursor: wait; background: transparent; color: var(--ink); }

.tag-card {
  position: relative; margin: 18px auto 0; padding: 20px 22px 20px 40px; max-width: 860px;
  background: var(--card); border: 1px solid var(--line); border-radius: 2px;
  display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
  box-shadow: 0 10px 28px rgba(38,48,31,.07);
}
.tag-card.fail { border-style: dashed; box-shadow: none; justify-content: space-between; }
.tag-card.fail strong { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; }
.tag-card.fail p { color: var(--muted); font-size: 13px; margin-top: 3px; }
.tag-hole {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--paper); border: 1.5px solid var(--gold);
}
.tag-art { width: 88px; height: 104px; flex: none; }
.tag-art img, .tag-art svg { width: 100%; height: 100%; object-fit: contain; }
.tag-info { min-width: 210px; flex: 1; }
.tag-title {
  width: 100%; font: 600 20px 'Cormorant Garamond', serif; font-style: italic; color: var(--ink);
  border: none; border-bottom: 1px solid var(--line); background: transparent;
  padding: 4px 2px 6px; margin-bottom: 10px;
}
.tag-title::placeholder { color: var(--muted); }
.tag-title:focus { outline: none; border-color: var(--gold); }
.tag-selects { display: flex; gap: 10px; flex-wrap: wrap; }
.tag-selects select {
  font: 500 11px 'Jost', sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 2px;
  background: var(--card); cursor: pointer;
}
.tag-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }

/* ---------------- chips / filters ---------------- */
.chip {
  display: inline-block; font-size: 10px; font-weight: 500;
  letter-spacing: .22em; text-transform: uppercase; color: var(--gold);
}
.chip.clickable {
  cursor: pointer; background: transparent; color: var(--muted); border: none;
  padding: 7px 2px; border-bottom: 1px solid transparent; font-size: 11px; letter-spacing: .18em;
  transition: color .15s ease, border-color .15s ease;
}
.chip.clickable:hover { color: var(--ink); }
.chip.clickable.on { color: var(--ink); border-bottom-color: var(--gold); }

.filters { margin: 40px 0 6px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.chip-row { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
.search {
  margin-top: 14px; width: 260px; max-width: 100%; padding: 9px 2px; text-align: center;
  border: none; border-bottom: 1px solid var(--line);
  font: italic 500 15px 'Cormorant Garamond', serif; background: transparent; color: var(--ink);
}
.search::placeholder { color: var(--muted); }
.search:focus { outline: none; border-bottom-color: var(--gold); }

/* ---------------- wardrobe rail ---------------- */
.rail {
  margin-top: 34px; display: grid; gap: 26px;
  grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
}
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 2px;
  padding: 18px 16px 18px; display: flex; flex-direction: column; text-align: center;
  transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
}
.card:hover { border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 14px 30px rgba(38,48,31,.08); }
.hangwrap { transform-origin: 50% 0; }
.card:hover .hangwrap { animation: sway 1.6s ease-in-out; }
@keyframes sway {
  0% { transform: rotate(0); } 25% { transform: rotate(1.8deg); }
  55% { transform: rotate(-1.3deg); } 80% { transform: rotate(.6deg); } 100% { transform: rotate(0); }
}
.hanger { width: 58%; margin: 0 auto; display: block; }
.card-art { height: 238px; margin-top: 6px; display: flex; align-items: center; justify-content: center; }
.card-art img.plate, .tag-art img.plate {
  width: 100%; height: 100%; object-fit: cover; object-position: top;
  border: 1px solid var(--line); border-radius: 2px; filter: none;
}
.card-art img, .card-art svg { max-width: 100%; max-height: 100%; }
.card-art img { filter: drop-shadow(0 8px 12px rgba(38,48,31,.18)); }
.card-info { margin-top: auto; padding-top: 12px; }
.card-info h2 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 19px; line-height: 1.2; margin: 4px 0 3px; }
.card-info p { color: var(--muted); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; }
.card-actions { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 14px; }

.icon-btn {
  border: none; background: transparent; cursor: pointer; color: var(--line);
  font-size: 14px; padding: 6px; border-radius: 2px; line-height: 1; transition: color .15s;
}
.icon-btn:hover { color: var(--ink); }
.icon-btn.del { position: absolute; visibility: hidden; }
.card { position: relative; }
.card:hover .icon-btn.del, .icon-btn.del:focus-visible { visibility: visible; }
.icon-btn.del { top: 8px; right: 8px; }

.empty {
  margin: 70px auto; text-align: center; color: var(--muted);
  font: italic 500 19px 'Cormorant Garamond', serif;
}
.foot {
  margin-top: 64px; text-align: center; color: var(--muted);
  font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
}
.foot::before { content: ""; display: block; width: 72px; height: 1px; background: var(--line); margin: 0 auto 18px; }

/* ---------------- fitting room ---------------- */
.fr-overlay {
  position: fixed; inset: 0; background: rgba(38,48,31,.45);
  display: flex; justify-content: flex-end; z-index: 50;
}
.fr-overlay[hidden] { display: none; }
.fr-panel {
  width: min(430px, 100%); background: var(--paper); height: 100%;
  padding: 26px 28px; overflow-y: auto;
  border-left: 1px solid var(--gold-soft);
  animation: slideIn .3s ease;
}
@keyframes slideIn { from { transform: translateX(36px); opacity: 0; } to { transform: none; opacity: 1; } }
.fr-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.fr-title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 28px; margin-top: 14px; }
.fr-sub { color: var(--gold); font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; margin: 4px 0 18px; }
.fr-stage {
  position: relative; background: var(--card); border: 1px solid var(--line);
  border-radius: 2px; padding: 12px; margin-bottom: 16px; text-align: center;
}
.fr-stage img { max-width: 100%; max-height: 58vh; display: block; margin: 0 auto; }
.fr-stage svg { width: auto; max-width: 100%; height: 58vh; max-height: 58vh; display: block; margin: 0 auto; }
.fr-note {
  font: italic 500 15px 'Cormorant Garamond', serif;
  color: var(--muted); line-height: 1.55; margin-top: 12px; text-align: center;
}

.keyrow { display: flex; gap: 8px; margin-top: 2px; }
.keyrow .paste-input { min-width: 0; }
.fr-err { color: #8F3B2C; }
.fr-stage.dim img { opacity: .45; }

#errBox {
  display: none; margin: 14px 0; padding: 12px 14px;
  background: #F5E9E4; border: 1px solid #A85B45; border-radius: 2px;
  color: #7C3A28; font-size: 13px; white-space: pre-wrap;
}

@media (max-width: 560px) {
  .page { padding-top: 28px; }
  .tag-actions { margin-left: 0; width: 100%; justify-content: center; }
  .rail { grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: 14px; }
  .card-art { height: 188px; }
  .chip-row { gap: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>

<div class="page">
  <header class="mast">
    <svg class="crest" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="18.4" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <path d="M24 13.5 Q27 13.5 27 16 Q27 17.8 24.9 18.4 L24.9 19.6 L35 27.5 L13 27.5 L23.1 19.6 L23.1 18.4 Q21 17.8 21 16 Q21 13.5 24 13.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M15 31.5 L33 31.5 M17.5 34.5 L30.5 34.5" stroke="currentColor" stroke-width="0.8"/>
    </svg>
    <span class="eyebrow">The private collection of Devika · Est. MMXXVI</span>
    <h1 class="name" id="closetName" title="Click to rename"></h1>
    <div class="count-line">
      <span class="rule"></span>
      <span class="count-text"><span id="countNum">·</span> pieces</span>
      <span class="rule"></span>
    </div>
    <div class="rule-double"></div>
  </header>

  <div id="errBox"></div>

  <p class="note">Every piece she owns, kept in one place. Tap a piece to see the real look.
    <em>Link fetching is simulated for now; the AI fitting room arrives with Gemini.</em></p>

  <section class="paste">
    <div class="paste-row">
      <input id="urlInput" class="paste-input" placeholder="Paste a product link — Myntra, ZARA, Flipkart, Urbanic, Savana…" aria-label="Product link">
      <button id="fetchBtn" class="btn primary">Fetch item</button>
      <button id="uploadBtn" class="btn">Upload photo</button>
      <input id="fileInput" type="file" accept="image/*" hidden>
    </div>
    <div id="previewArea"></div>
  </section>

  <section class="filters">
    <div class="chip-row" id="catChips" role="group" aria-label="Filter by category"></div>
    <div class="chip-row" id="brandChips" role="group" aria-label="Filter by brand"></div>
    <input class="search" id="searchInput" placeholder="Search pieces…" aria-label="Search wardrobe">
  </section>

  <section class="rail" id="grid"></section>
  <p class="empty" id="emptyMsg" hidden></p>

  <footer class="foot">Kept with love · The Wardrobe</footer>
</div>

<div id="frOverlay" class="fr-overlay" hidden role="dialog" aria-label="Fitting room"></div>

<script>
(function () {
  "use strict";

  window.addEventListener("error", function (e) {
    var box = document.getElementById("errBox");
    if (box) { box.style.display = "block"; box.textContent = "Error: " + (e.message || e.error); }
  });

  /* --------------------- Supabase (optional backend) --------------------- */
  // Fill these in after running supabase/setup.sql and deploying the `closet`
  // edge function. Leave empty and the site runs fully in-browser as before.
  var SB_URL = "";   // e.g. "https://abcd1234.supabase.co"
  var SB_ANON = "";  // Project Settings -> API -> anon public key
  var SB_PIN = "";   // must match the CLOSET_PIN secret, if you set one

  function sbCall(action, payload, cb, onErr) {
    payload = payload || {};
    payload.action = action;
    fetch(SB_URL + "/functions/v1/closet", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + SB_ANON,
        "apikey": SB_ANON,
        "x-closet-pin": SB_PIN
      },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.error) { if (onErr) onErr(j.error); return; }
      cb(j);
    }).catch(function () {
      if (onErr) onErr("Network error \u2014 check the Supabase URL and that the function is deployed.");
    });
  }

  function sbLoadWardrobe() {
    if (!SB_URL) return;
    fetch(SB_URL + "/rest/v1/wardrobe?select=*&order=created_at.desc", {
      headers: { "apikey": SB_ANON, "Authorization": "Bearer " + SB_ANON }
    }).then(function (r) { return r.json(); }).then(function (rows) {
      if (!Array.isArray(rows)) return;
      state.remote = rows.map(function (r) {
        return { id: r.id, title: r.title, brand: r.brand || "", category: r.category || "Dress",
                 color: "plum", plate: r.plate_url, tryon: r.tryon_url, remote: true };
      });
      rebuildItems();
      renderAll();
    }).catch(function () {});
  }

  function shrinkTo(dataUri, maxH, cb) {
    var img = new Image();
    img.onload = function () {
      try {
        var s = Math.min(1, maxH / Math.max(img.width, img.height));
        if (s === 1) { cb(dataUri); return; }
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.87));
      } catch (e) { cb(dataUri); }
    };
    img.onerror = function () { cb(dataUri); };
    img.src = dataUri;
  }

        '<path d="M42 92 L78 92" stroke="' + detail + '" stroke-width="1.5"/>';

        '<path d="M48 46 L54 40 L60 24 L66 40 L72 46" fill="none" stroke="' + detail + '" stroke-width="1.5"/>' +
        '<circle cx="58" cy="60" r="1.8" fill="' + detail + '"/><circle cx="58" cy="72" r="1.8" fill="' + detail + '"/>';

  }
  function garmentArt(item) {
    if (item.plate) return '<img class="plate" src="' + item.plate + '" alt="" loading="lazy">';
    var src = item.img || item.uploaded;
    if (src) return '<img src="' + src + '" alt="" loading="lazy">';
    var fill = PALETTE[item.color] || PALETTE.plum;
    return '<svg viewBox="0 0 120 140" aria-hidden="true">' + garmentPaths(item.category, fill) + '</svg>';
  }
  var HANGER = '<svg viewBox="0 0 120 26" class="hanger" aria-hidden="true">' +
    '<path d="M60 2 Q66 2 66 7 Q66 10 62 11 L62 13 L106 22 L14 22 L58 13 L58 11 Q54 10 54 7 Q54 2 60 2" ' +
    'fill="none" stroke="#9C7E3A" stroke-width="2.5" stroke-linejoin="round"/></svg>';

  /* ----------------------------- header ------------------------------ */
  function renderName() {
    var h = el("closetName");
    h.innerHTML = esc(state.name) +
      '<svg viewBox="0 0 20 20" class="pencil" aria-hidden="true"><path d="M14 3 L17 6 L7 16 L3 17 L4 13 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  }
  el("closetName").addEventListener("click", function () {
    var h = el("closetName");
    var input = document.createElement("input");
    input.className = "name-input";
    input.value = state.name;
    input.setAttribute("aria-label", "Closet name");
    h.replaceWith(input);
    input.focus();
    function done() {
      state.name = input.value.trim() || state.name;
      input.replaceWith(h);
      renderName();
      persist();
    }
    input.addEventListener("blur", done);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") input.blur(); });
  });

  /* --------------------------- paste / add --------------------------- */
  el("fetchBtn").addEventListener("click", fetchLink);
  el("urlInput").addEventListener("keydown", function (e) { if (e.key === "Enter") fetchLink(); });
  el("uploadBtn").addEventListener("click", function () { el("fileInput").click(); });
  el("fileInput").addEventListener("change", onPhoto);

  function fetchLink() {
    var url = el("urlInput").value.trim();
    if (!url) return;
    state.fetchState = "loading";
    state.preview = null;
    renderPreview();
    var brand = detectBrand(url);
    setTimeout(function () {
      if (brand === "Amazon") {
        state.fetchState = "failed";
        renderPreview();
        return;
      }
      var cat = pick(CATEGORIES);
      state.preview = {
        id: "i" + Date.now() + Math.floor(Math.random() * 999),
        title: pick(MOCK_TITLES[cat]),
        brand: brand,
        category: cat,
        color: pick(Object.keys(PALETTE)),
        link: url
      };
      state.fetchState = "preview";
      renderPreview();
    }, 1200);
  }

  function onPhoto(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      shrinkTo(reader.result, 1400, function (small) {
        var url = el("urlInput").value.trim();
        state.preview = {
          id: "i" + Date.now(),
          title: "",
          brand: url ? detectBrand(url) : "Other",
          category: "Dress",
          color: "plum",
          link: url,
          uploaded: small
        };
        state.fetchState = "preview";
        renderPreview();
      });
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }

  function renderPreview() {
    var area = el("previewArea");
    var fb = el("fetchBtn");
    fb.disabled = state.fetchState === "loading";
    fb.textContent = state.fetchState === "loading" ? "Fetching…" : "Fetch item";

    if (state.fetchState === "failed") {
      area.innerHTML =
        '<div class="tag-card fail"><div><strong>Couldn\'t read that page.</strong>' +
        '<p>Some stores block fetching. Upload a photo or screenshot of the piece instead.</p></div>' +
        '<button class="btn" id="failUpload">Upload photo</button></div>';
      el("failUpload").addEventListener("click", function () { el("fileInput").click(); });
      return;
    }
    if (state.fetchState === "creating") {
      area.innerHTML = '<div class="tag-card"><div class="tag-hole" aria-hidden="true"></div>' +
        '<p class="fr-note">Gemini is crafting the catalogue image \u2014 a few seconds\u2026</p></div>';
      return;
    }
    if (state.fetchState !== "preview" || !state.preview) { area.innerHTML = ""; return; }

    var p = state.preview;
    var brandOpts = BRANDS.map(function (b) {
      return '<option' + (b === p.brand ? " selected" : "") + '>' + b + '</option>';
    }).join("");
    var catOpts = CATEGORIES.map(function (c) {
      return '<option' + (c === p.category ? " selected" : "") + '>' + c + '</option>';
    }).join("");

    area.innerHTML =
      '<div class="tag-card"><div class="tag-hole" aria-hidden="true"></div>' +
      '<div class="tag-art">' + garmentArt(p) + '</div>' +
      '<div class="tag-info">' +
        '<input class="tag-title" id="pvTitle" placeholder="Name this piece…" value="' + esc(p.title) + '" aria-label="Item name">' +
        '<div class="tag-selects">' +
          '<select id="pvBrand" aria-label="Brand">' + brandOpts + '</select>' +
          '<select id="pvCat" aria-label="Category">' + catOpts + '</select>' +
        '</div></div>' +
      '<div class="tag-actions">' +
        '<button class="btn primary" id="pvAdd">Add to wardrobe</button>' +
                '<button class="btn ghost" id="pvDiscard">Discard</button>' +
      '</div></div>';

    el("pvTitle").addEventListener("input", function (e) { p.title = e.target.value; });
    el("pvBrand").addEventListener("change", function (e) { p.brand = e.target.value; });
    el("pvCat").addEventListener("change", function (e) {
      p.category = e.target.value;
      if (!p.uploaded) document.querySelector("#previewArea .tag-art").innerHTML = garmentArt(p);
    });
    el("pvAdd").addEventListener("click", function () { addItem(false); });
    el("pvDiscard").addEventListener("click", function () {
      state.preview = null; state.fetchState = "idle"; renderPreview();
    });
  }

  function addItem(andTryOn) {
    if (!state.preview) return;
    var item = state.preview;
    item.title = (item.title || "").trim() || "Untitled piece";
    if (SB_URL && item.uploaded) {
      var d = splitDataUri(item.uploaded);
      if (d) {
        state.fetchState = "creating";
        renderPreview();
        sbCall("add", {
          image: d.data, mime: d.mime,
          title: item.title,
          brand: item.brand === "Other" ? "" : item.brand,
          category: item.category
        }, function (j) {
          var r = j.item;
          state.remote.unshift({ id: r.id, title: r.title, brand: r.brand || "",
            category: r.category, color: "plum", plate: r.plate_url,
            tryon: r.tryon_url, remote: true });
          state.preview = null; state.fetchState = "idle";
          el("urlInput").value = "";
          renderPreview(); rebuildItems(); renderAll();
        }, function (msg) {
          state.fetchState = "preview";
          renderPreview();
          alert("Catalogue generation failed: " + msg);
        });
        return;
      }
    }
    state.added.unshift(item);
    rebuildItems();
    state.preview = null;
    state.fetchState = "idle";
    el("urlInput").value = "";
    renderPreview();
    renderAll();
    persist();
  }

  /* ----------------------------- filters ----------------------------- */
  el("searchInput").addEventListener("input", function (e) {
    state.query = e.target.value; renderGrid();
  });

  function renderFilters() {
    el("catChips").innerHTML = ["All"].concat(CATEGORIES).map(function (c) {
      return '<button class="chip clickable alt' + (state.catFilter === c ? " on" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    }).join("");
    var brands = [];
    state.items.forEach(function (i) { if (i.brand && brands.indexOf(i.brand) < 0) brands.push(i.brand); });
    el("brandChips").innerHTML = brands.length
      ? ["All"].concat(brands).map(function (b) {
          return '<button class="chip clickable' + (state.brandFilter === b ? " on" : "") + '" data-brand="' + esc(b) + '">' + esc(b) + '</button>';
        }).join("")
      : "";
  }
  el("brandChips").addEventListener("click", function (e) {
    var b = e.target.getAttribute && e.target.getAttribute("data-brand");
    if (b) { state.brandFilter = b; renderFilters(); renderGrid(); }
  });
  el("catChips").addEventListener("click", function (e) {
    var c = e.target.getAttribute && e.target.getAttribute("data-cat");
    if (c) { state.catFilter = c; renderFilters(); renderGrid(); }
  });

  /* ------------------------------ grid ------------------------------- */
  function renderGrid() {
    var q = state.query.toLowerCase();
    var filtered = state.items.filter(function (i) {
      return (state.catFilter === "All" || i.category === state.catFilter) &&
             (state.brandFilter === "All" || i.brand === state.brandFilter) &&
             (!q || i.title.toLowerCase().indexOf(q) >= 0);
    });
    el("countNum").textContent = toRoman(state.items.length);

    var empty = el("emptyMsg");
    if (filtered.length === 0) {
      empty.hidden = false;
      empty.textContent = state.items.length === 0
        ? "Her closet is empty — paste a link above to hang the first piece."
        : "Nothing matches those filters.";
    } else {
      empty.hidden = true;
    }

    el("grid").innerHTML = filtered.map(function (i) {
      return '<article class="card" data-id="' + esc(i.id) + '">' +
        '<div class="hangwrap">' + HANGER + '<div class="card-art">' + garmentArt(i) + '</div></div>' +
        '<div class="card-info">' +
        (i.brand ? '<span class="chip">' + esc(i.brand) + '</span>' : '') +
        '<h2>' + esc(i.title) + '</h2><p>' + esc(i.category) + '</p>' +
        '<div class="card-actions">' +
          '<button class="btn small primary" data-action="try">' + (getTryon(i) ? 'See the look' : 'Try on') + '</button>' +
          (i.link ? '<a class="btn small" href="' + esc(i.link) + '" target="_blank" rel="noreferrer">Store page</a>' : "") +
          '<button class="icon-btn del" data-action="del" aria-label="Remove ' + esc(i.title) + '">✕</button>' +
        '</div></div></article>';
    }).join("");
  }
  el("grid").addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!btn) return;
    var card = btn.closest("article.card");
    var id = card && card.getAttribute("data-id");
    var item = state.items.filter(function (i) { return i.id === id; })[0];
    if (!item) return;
    if (btn.getAttribute("data-action") === "del") {
      if (item.remote) {
        state.remote = state.remote.filter(function (i) { return i.id !== id; });
        sbCall("delete", { id: id }, function () {}, function () {});
      } else if (ITEMS.some(function (i) { return i.id === id; })) {
        state.removedIds.push(id);
      } else {
        state.added = state.added.filter(function (i) { return i.id !== id; });
      }
      rebuildItems();
      renderAll();
      persist();
    } else if (btn.getAttribute("data-action") === "try") {
      openFitting(item);
    }
  });

  var GEN_MODELS = ["gemini-2.5-flash-image", "gemini-2.5-flash-image-preview"];
  var GEN_PROMPT = "Dress the woman from the first image in the garment shown in the second image. " +
    "Keep her face, hair, skin tone, body shape, pose and the background exactly the same. " +
    "Replace her current outfit with the new garment, fitted naturally with realistic drape, " +
    "lighting and shadows. Output a single photorealistic image.";

  function getTryon(item) { return item.tryon || state.gen[item.id] || null; }

  function openFitting(item) {
    state.fitting = item;
    state.busy = false;
    state.err = "";
    renderFitting();
    el("frOverlay").hidden = false;
  }
  function closeFitting() {
    el("frOverlay").hidden = true;
    state.fitting = null;
  }
  el("frOverlay").addEventListener("click", function (e) {
    if (e.target === el("frOverlay")) closeFitting();
  });

  function splitDataUri(uri) {
    var m = /^data:([^;]+);base64,(.*)$/.exec(uri);
    return m ? { mime: m[1], data: m[2] } : null;
  }

  function shrinkImage(dataUri, cb) {
    var img = new Image();
    img.onload = function () {
      try {
        var s = Math.min(1, 900 / img.height);
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.85));
      } catch (e) { cb(dataUri); }
    };
    img.onerror = function () { cb(dataUri); };
    img.src = dataUri;
  }

  function genTryon(item) {
    var garment = splitDataUri(item.plate || item.uploaded || "");
    var base = splitDataUri(BASE_PHOTO);
    if (!garment || !base) { state.err = "No garment image available for this piece."; renderFitting(); return; }
    state.busy = true; state.err = "";
    renderFitting();
    var body = JSON.stringify({
      contents: [{ parts: [
        { inline_data: { mime_type: base.mime, data: base.data } },
        { inline_data: { mime_type: garment.mime, data: garment.data } },
        { text: GEN_PROMPT }
      ]}]
    });
    function attempt(i) {
      if (i >= GEN_MODELS.length) { fail("No available image model on this key."); return; }
      fetch("https://generativelanguage.googleapis.com/v1beta/models/" + GEN_MODELS[i] +
            ":generateContent?key=" + encodeURIComponent(state.key), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: body
      }).then(function (r) {
        if (r.status === 404) { attempt(i + 1); return null; }
        return r.json();
      }).then(function (j) {
        if (!j) return;
        if (j.error) { fail(j.error.message || "The API returned an error."); return; }
        var parts = (((j.candidates || [])[0] || {}).content || {}).parts || [];
        var img = null;
        for (var p = 0; p < parts.length; p++) {
          var d = parts[p].inlineData || parts[p].inline_data;
          if (d && d.data) { img = "data:" + (d.mimeType || d.mime_type || "image/png") + ";base64," + d.data; break; }
        }
        if (!img) { fail("The model returned no image \u2014 try once more."); return; }
        shrinkImage(img, function (small) {
          state.gen[item.id] = small;
          store.set("tryon-overrides", state.gen);
          state.busy = false;
          renderFitting();
          renderGrid();
        });
      }).catch(function (e) {
        fail("Request blocked \u2014 if you are inside the chat preview, open the file in a normal browser tab; API calls only work there or on the deployed site.");
      });
    }
    function fail(msg) { state.busy = false; state.err = msg; renderFitting(); }
    attempt(0);
  }

  function renderFitting() {
    var item = state.fitting;
    if (!item) return;
    var t = getTryon(item);
    var body = "";
    if (t) {
      body = '<div class="fr-stage"><img src="' + t + '" alt="Her look"></div>' +
        '<p class="fr-note">' + (item.tryon ? "The real look \u2014 straight from her gallery." : "Her AI fitting \u2014 generated once, kept in her closet.") + '</p>';
    } else if (state.busy) {
      body = '<div class="fr-stage dim"><img src="' + (item.plate || item.uploaded || "") + '" alt=""></div>' +
        '<button class="btn primary wide" disabled>Fitting\u2026</button>' +
        '<p class="fr-note">Gemini is dressing Devika in this piece \u2014 a few seconds.</p>';
    } else {
      body = '<div class="fr-stage"><img src="' + (item.plate || item.uploaded || "") + '" alt=""></div>';
      if (SB_URL && item.remote) {
        body += '<button class="btn primary wide" id="frGenSb">Dress Devika in this</button>' +
          '<p class="fr-note">Photoreal AI fitting \u2014 generated once and kept in her closet, for every visitor.</p>';
        if (state.err) body += '<p class="fr-note fr-err">' + esc(state.err) + '</p>';
      } else if (!state.key) {
        body += '<div class="keyrow">' +
          '<input type="password" id="frKey" class="paste-input" placeholder="Paste your Gemini API key">' +
          '<button class="btn" id="frSaveKey">Save</button></div>' +
          '<p class="fr-note">One-time setup: get a free key at aistudio.google.com \u2192 \u201cGet API key\u201d. It is kept only in this browser.</p>';
      } else {
        body += '<button class="btn primary wide" id="frGen">Dress Devika in this</button>' +
          '<p class="fr-note">Photoreal AI fitting \u2014 generated with Gemini, saved after the first run.</p>';
      }
      if (state.err) body += '<p class="fr-note fr-err">' + esc(state.err) + '</p>';
    }

    el("frOverlay").innerHTML =
      '<div class="fr-panel">' +
        '<div class="fr-head"><span class="eyebrow">The fitting room</span>' +
        '<button class="icon-btn" id="frClose" aria-label="Close">\u2715</button></div>' +
        '<h3 class="fr-title">' + esc(item.title) + '</h3>' +
        '<p class="fr-sub">' + esc(item.brand ? item.brand + " \u00b7 " : "") + esc(item.category) + '</p>' +
        body + '</div>';

    var panel = el("frOverlay").firstChild;
    panel.addEventListener("click", function (e) { e.stopPropagation(); });
    el("frClose").addEventListener("click", closeFitting);
    var sk = el("frSaveKey");
    if (sk) sk.addEventListener("click", function () {
      var v = el("frKey").value.trim();
      if (!v) return;
      state.key = v;
      store.set("gemini-key", v);
      renderFitting();
    });
    var g = el("frGen");
    if (g) g.addEventListener("click", function () { genTryon(item); });
    var gs = el("frGenSb");
    if (gs) gs.addEventListener("click", function () { sbTryon(item); });
  }

  function sbTryon(item) {
    state.busy = true; state.err = "";
    renderFitting();
    sbCall("tryon", { id: item.id }, function (j) {
      item.tryon = j.tryon;
      state.busy = false;
      renderFitting();
      renderGrid();
    }, function (msg) {
      state.busy = false; state.err = msg;
      renderFitting();
    });
  }

  /* ------------------------------ boot ------------------------------- */
  function renderAll() { renderName(); renderFilters(); renderGrid(); }
  rebuildItems();
  renderAll();

  sbLoadWardrobe();
  store.get("gemini-key").then(function (k) { if (k) state.key = k; });
  store.get("tryon-overrides").then(function (g) {
    if (g) { state.gen = g; renderGrid(); }
  });
  store.get("closet-v2").then(function (saved) {
    if (saved) {
      if (saved.name && saved.name !== "My Best Friend's Closet" && saved.name !== "Her Closet") state.name = saved.name;
      if (saved.added) state.added = saved.added;
      if (saved.removedIds) state.removedIds = saved.removedIds;
      rebuildItems();
      renderAll();
    }
  });
})();
